services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: infrabench-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infrabench}
      POSTGRES_USER: ${POSTGRES_USER:-infrabench_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-infrabench_secure_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/01_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-infrabench_user} -d $${POSTGRES_DB:-infrabench}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - infrabench-net

  # ----------------------------------------------------------------------------
  # Redis In-Memory Cache Service
  # ----------------------------------------------------------------------------
  cache:
    image: redis:7-alpine
    container_name: infrabench-cache
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped
    networks:
      - infrabench-net

  # ----------------------------------------------------------------------------
  # FastAPI Application Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infrabench-app
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      REDIS_HOST: cache
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - infrabench-net

  # ----------------------------------------------------------------------------
  # Synthetic Load Generator Service (On-Demand / Profile: loadgen)
  # ----------------------------------------------------------------------------
  load-generator:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: infrabench-loadgen
    profiles:
      - loadgen
    command: ["python", "-m", "load_generator.generator", "--url", "http://app:8000", "-n", "100", "-c", "5", "--seed", "42"]
    depends_on:
      app:
        condition: service_healthy
    networks:
      - infrabench-net

# ------------------------------------------------------------------------------
# Persistent Storage Volumes
# ------------------------------------------------------------------------------
volumes:
  postgres_data:
    name: infrabench_postgres_data
  redis_data:
    name: infrabench_redis_data

# ------------------------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------------------------
networks:
  infrabench-net:
    name: infrabench-network
    driver: bridge
